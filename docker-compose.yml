services:
  storebot:
    build: .
    container_name: storebot
    restart: unless-stopped
    env_file: .env
    environment:
      - WEBHOOK_PORT=3000
    ports:
      - "${WEBHOOK_PORT:-3005}:3000"
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
